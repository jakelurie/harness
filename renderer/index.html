<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>Harness</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="drag-strip"></div>

    <div id="app">
      <aside id="sidebar">
        <div class="side-head">
          <span class="brand">harness</span>
          <button id="new-session" class="icon-btn" title="New session">+</button>
        </div>
        <div id="session-list"></div>
        <div class="side-foot">
          <button id="edit-models" class="link-btn">edit models.json</button>
          <button id="reload-models" class="link-btn">reload</button>
        </div>
      </aside>

      <main id="main">
        <header id="header">
          <div class="head-left">
            <input id="session-name" class="name-input" spellcheck="false" />
            <button id="project-dir" class="dir-btn" title="Change project directory"></button>
          </div>
          <div class="head-right">
            <select id="model-select" title="Switch model - history carries over"></select>
            <button id="fork-btn" class="ghost-btn" title="Clone this session onto another model">fork</button>
            <button id="stats-btn" class="ghost-btn">stats</button>
          </div>
        </header>

        <div id="banner" class="banner" hidden></div>

        <div id="transcript"></div>

        <footer id="composer">
          <textarea
            id="input"
            rows="1"
            placeholder="Describe what you want built.  ⏎ to send, ⇧⏎ for a new line."
            spellcheck="false"
          ></textarea>
          <button id="send" class="send-btn">send</button>
          <button id="stop" class="stop-btn" hidden>stop</button>
        </footer>
      </main>
    </div>

    <div id="modal-back" class="modal-back" hidden>
      <div class="modal" id="modal"></div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
