# Model registry. Adding a model is a config edit - no code changes.
#
#   provider     which backend class handles it: "anthropic" | "openai"
#                ("openai" = anything speaking POST /v1/chat/completions)
#   model        the wire model id the provider sends
#   base_url     override the API host (required for self-hosted / third-party)
#   api_key_env  env var holding the key (Anthropic falls back to the SDK's own
#                resolution - ANTHROPIC_API_KEY or an `ant auth login` profile)
#   price_in/out $ per 1M tokens, purely for the /stats cost tally
#
# Any other key in a model block is passed to the provider as a parameter.

default = "opus"


[models.opus]
provider  = "anthropic"
model     = "claude-opus-5"
label     = "Claude Opus 5"
price_in  = 5.0
price_out = 25.0
effort    = "high"        # low | medium | high | xhigh | max
max_tokens = 32000

[models.sonnet]
provider  = "anthropic"
model     = "claude-sonnet-5"
label     = "Claude Sonnet 5"
price_in  = 2.0
price_out = 10.0
max_tokens = 32000


# ---------------------------------------------------------------------------
# Astra. Fill in base_url and model once you have the endpoint details, then
# `export ASTRA_API_KEY=...`. Nothing else in the harness needs to change.
# ---------------------------------------------------------------------------
[models.astra]
provider    = "openai"
model       = "astra-1"
label       = "Astra"
base_url    = "https://api.astra.example.com/v1"
api_key_env = "ASTRA_API_KEY"
max_tokens  = 8192
# temperature = 0.7
# reasoning_effort = "high"
# [models.astra.extra_body]      # vendor-specific fields, passed through as-is
# some_astra_only_flag = true


